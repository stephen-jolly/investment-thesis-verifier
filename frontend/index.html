<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>投资命题验证台 | Thesis Verifier</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>

<div class="app-shell">

  <!-- 左侧栏 -->
  <aside id="sidebar" class="sidebar">
    <div class="px-4 pt-4 pb-3 flex items-center gap-2">
      <div class="w-7 h-7 rounded-lg bg-brand flex items-center justify-center text-white text-xs font-bold">验</div>
      <span class="font-semibold text-ink text-sm">投资命题验证台</span>
    </div>

    <div class="px-3">
      <button id="newChatBtn"
        class="w-full flex items-center justify-center gap-2 rounded-lg border border-slate-300 hover:bg-slate-50 text-slate-700 text-sm font-medium py-2 transition">
        ＋ 新建对话
      </button>
    </div>

    <div class="px-3 mt-4 flex-1 overflow-y-auto">
      <div id="conversationList" class="space-y-0.5"></div>
    </div>

    <div class="px-4 py-3 border-t border-slate-200 text-[10px] leading-relaxed text-slate-400">
      数据：扶摇金融数据 API<br />智能：豆包大模型
    </div>
  </aside>

  <div id="sidebarMask" class="sidebar-mask"></div>

  <!-- 主区域 -->
  <main class="main-pane">

    <header class="main-header">
      <button id="menuToggle" class="md:hidden text-slate-600 text-xl px-1">☰</button>
      <div id="chatTitle" class="text-sm font-medium text-slate-600 truncate">投资命题验证台</div>
    </header>

    <!-- 消息流 -->
    <div id="messages" class="messages">

      <div id="welcome" class="welcome">
        <div class="w-12 h-12 rounded-xl bg-brand flex items-center justify-center text-white text-lg font-bold mx-auto mb-4">验</div>
        <h1 class="text-lg font-semibold text-ink mb-2">验证你的投资命题</h1>
        <p class="text-sm text-slate-500 max-w-md mx-auto mb-6 leading-relaxed">
          输入一个投资判断，我会把它拆成可验证子问题、调取真实数据，
          给出结论、关键依据与来源。
        </p>
        <div class="flex flex-wrap justify-center gap-2 max-w-xl">
          <button class="suggest-btn">贵州茅台2023年盈利增长主要来自主营业务</button>
          <button class="suggest-btn">宁德时代估值回落但基本面没有恶化</button>
          <button class="suggest-btn">比亚迪近三年盈利能力持续提升</button>
        </div>
        <div class="mt-8 max-w-lg mx-auto text-[11px] text-slate-400 leading-relaxed">
          仅提供基于公开数据的事实验证，不输出涨跌预测、目标价或买卖建议。
        </div>
      </div>

    </div>

    <!-- 底部输入区 -->
    <div class="composer-wrap">
      <div class="composer">
        <textarea id="composerInput" rows="1"
          placeholder="输入投资命题，或基于结论继续追问…"></textarea>
        <button id="sendBtn" title="发送">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="5 12 12 5 19 12"></polyline>
          </svg>
        </button>
      </div>
      <div class="composer-hint">Enter 发送 · Shift + Enter 换行</div>
    </div>

  </main>
</div>

<script src="/static/app.js"></script>
</body>
</html>
